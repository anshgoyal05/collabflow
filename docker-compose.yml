services:
  redis:
    image: redis:7-alpine
    container_name: collabflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

  websocket-server-1:
    build: .
    container_name: collabflow-server-1
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - REDIS_ADDR=redis:6379
      - SERVER_ID=SERVER-1
    depends_on:
      redis:
        condition: service_healthy

  websocket-server-2:
    build: .
    container_name: collabflow-server-2
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - REDIS_ADDR=redis:6379
      - SERVER_ID=SERVER-2
    depends_on:
      redis:
        condition: service_healthy
